# A virtual part: an AMS CCS811 eCO2 and TVOC air quality sensor on I2C,
# compiled to a WebAssembly module the emulator loads. README.md in the fixture
# folder says what it models.
#
# Its own workspace, so it builds on its own and nothing here enters esp-emu's
# dependency graph. `esp-part` comes from the vendored esp-emulator checkout,
# which the root .gitignore keeps out of version control.
[workspace]

[package]
name = "ccs811"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# A cdylib builds to the .wasm module a host loads.
crate-type = ["cdylib"]

[dependencies]
esp-part = { path = "../../../../esp-emulator/esp-part" }

[profile.release]
# A smaller module loads faster.
opt-level = "s"
lto = true
strip = true
