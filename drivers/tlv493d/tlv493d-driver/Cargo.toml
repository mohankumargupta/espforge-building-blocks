# The Rust half of the external `<tlv493d>` driver. Generic over
# `embedded_hal::i2c::I2c`, so it does not depend on esp-hal, and the
# manifest instantiates it with the endpoint espforge builds.
[workspace]

[package]
name = "tlv493d-driver"
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic Infineon TLV493D-A1B6 3D magnetic sensor driver"
license = "MIT"

[dependencies]
embedded-hal = "1.0"
