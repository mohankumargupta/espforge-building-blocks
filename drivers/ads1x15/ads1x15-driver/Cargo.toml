# The Rust half of the external `<ads1x15>` driver. Generic over
# `embedded_hal::i2c::I2c`, so it does not depend on esp-hal, and the
# manifest instantiates it with the endpoint espforge builds.
[workspace]

[package]
name = "ads1x15-driver"
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic TI ADS1015/ADS1115 I2C ADC driver"
license = "MIT"

[dependencies]
embedded-hal = "1.0"
