# The Rust half of the external `<am2320>` driver. Generic over
# `embedded_hal::i2c::I2c`, so it does not depend on esp-hal, and the
# manifest instantiates it with the endpoint espforge builds.
[workspace]

[package]
name = "am2320-driver"
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic AOSONG AM2320 temperature and humidity driver"
license = "MIT"

[dependencies]
embedded-hal = "1.0"
