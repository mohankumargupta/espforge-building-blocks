# The Rust half of the external `<mpu9250>` driver. Generic over
# `embedded_hal::spi::SpiDevice`, so it does not depend on esp-hal, and the
# manifest instantiates it with the endpoint espforge builds.
[workspace]

[package]
name = "mpu9250-driver"
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic InvenSense MPU-9250 accelerometer and gyro driver"
license = "MIT"

[dependencies]
embedded-hal = "1.0"
