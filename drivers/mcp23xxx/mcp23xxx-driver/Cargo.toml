# The Rust half of the external `<mcp23xxx>` driver. Generic over
# `embedded_hal::i2c::I2c`, so it does not depend on esp-hal, and the
# manifest instantiates it with the endpoint espforge builds.
[workspace]

[package]
name = "mcp23xxx-driver"
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic Microchip MCP23017 16-bit I2C I/O expander driver"
license = "MIT"

[dependencies]
embedded-hal = "1.0"
