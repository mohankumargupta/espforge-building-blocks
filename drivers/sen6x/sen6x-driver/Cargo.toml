# The Rust half of the external `<sen6x>` driver. Generic over
# `embedded_hal::i2c::I2c`, so it does not depend on esp-hal, and the
# manifest instantiates it with the endpoint espforge builds.
[workspace]

[package]
name = "sen6x-driver"
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic Sensirion SEN6x air-quality sensor driver"
license = "MIT"

[dependencies]
embedded-hal = "1.0"
