# The Rust half of the external `<mfrc522>` driver. Generic over
# `embedded_hal::spi::SpiDevice`, so it does not depend on esp-hal, and the
# manifest instantiates it with the endpoint espforge builds.
[workspace]

[package]
name = "mfrc522-driver"
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic NXP MFRC522 contactless reader driver"
license = "MIT"

[dependencies]
embedded-hal = "1.0"
