# The Rust half of the external `<ds3231>` driver. Generic over
# `embedded_hal::i2c::I2c`, so it does not depend on esp-hal, and the
# manifest instantiates it with the endpoint espforge builds.
[workspace]

[package]
name = "ds3231-driver"
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic Maxim DS3231 real-time clock driver"
license = "MIT"

[dependencies]
embedded-hal = "1.0"
